# =============================================================================
# cloudbuild.yaml - job-extract (Job 1: API -> bucket)
# Pasos: build de la imagen, push a Artifact Registry y deploy del Cloud Run Job.
#
# Solo se editan las "substitutions". Para otro ambiente, sobrescríbelas en el
# trigger (Advanced > Substitution variables), p. ej. _PROYECTO_JOB.
# ${PROJECT_ID} (proyecto del build) y ${SHORT_SHA} (commit) las pone Cloud Build.
# =============================================================================
substitutions:
  _REGION: us-central1

  # --- Imagen (Artifact Registry, en el proyecto del build) ------------------
  _REPO_AR: dev-ctn-arg-comex-001
  _NOMBRE_IMAGEN: job-ingesta-api       # igual que el repo de GitHub

  # --- Cloud Run Job ---------------------------------------------------------
  _PROYECTO_JOB: jclab-dev-brz-tmp
  _JOB: job-extract
  _SA_JOB: dev-seg-gsa-comex-ing-cpr    # solo el nombre, sin @...
  _SECRETO: api-config                  # llega como API_CONFIG
  _BUCKET: dev-stg-gst-comex-001
  _PROYECTO_DATASET: jclab-dev-brz-tmp  # tabla de control: proyecto.dataset.tabla
  _DATASET: ext_comex
  _TABLA_CONTROL: ctl_log_ingesta

  # --- Calculada: no editar --------------------------------------------------
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_AR}/${_NOMBRE_IMAGEN}

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${SHORT_SHA}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_JOB}
      - --project=${_PROYECTO_JOB}
      - --region=${_REGION}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --service-account=${_SA_JOB}@${_PROYECTO_JOB}.iam.gserviceaccount.com
      - --set-secrets=API_CONFIG=${_SECRETO}:latest
      # FECHA_DATOS, ENDPOINTS, INTENTO, etc. las envía Airflow en cada ejecución
      - --set-env-vars=BUCKET=${_BUCKET},TABLA_LOG=${_PROYECTO_DATASET}.${_DATASET}.${_TABLA_CONTROL}
      # Los reintentos los controla Airflow
      - --max-retries=0
      - --task-timeout=30m

images: ["${_IMAGE}:${SHORT_SHA}"]

options:
  logging: CLOUD_LOGGING_ONLY      # sin bucket de logs
  dynamicSubstitutions: true       # permite armar _IMAGE con otras variables
