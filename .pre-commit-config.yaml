# Corre black, flake8 y pydocstyle en cada git commit.
# Usa las herramientas ya instaladas en el venv (language: system),
# así que el venv debe estar activo al hacer commit.
# Instalar una vez con: pre-commit install
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --line-length=79
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
      - id: pydocstyle
        name: pydocstyle
        entry: pydocstyle --convention=pep257
        language: system
        types: [python]
